# ReliAgent — release workflow
#
# Trigger: pushing a tag matching v*.*.* (e.g. v0.1.0).
#
# Two jobs, so the code that runs third-party build scripts never holds the
# signing identity or a write token:
#
#   build (per platform, read-only token, no OIDC):
#     1. Check the tag name, remap local paths out of the binary.
#     2. fmt, clippy, build, unit + integration + red-team tests.
#     3. Bundle the binary with the pinned Python runtime and the sidecar
#        (scripts/package_release.sh), smoke-test it, run the sidecar
#        isolation tests against the bundled interpreter.
#     4. Archive the bundle (files owned by uid 0) and generate its SBOM
#        (SPDX + CycloneDX) with Syft.
#
#   release (OIDC + write token, runs no project code):
#     5. Keyless-sign every archive and SBOM with cosign, attest build
#        provenance, upload everything to a draft GitHub release.
#
# Every action is pinned to a full commit SHA (version in the comment).
#
# Verification (for end users) — see the release notes for the exact
# identity of each tag:
#   cosign verify-blob \
#       --certificate <archive>.cert --signature <archive>.sig \
#       --certificate-identity "https://github.com/neomikhe/ReliAgent/.github/workflows/release.yml@refs/tags/<tag>" \
#       --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#       <archive>
#   gh attestation verify <archive> --repo neomikhe/ReliAgent \
#       --signer-workflow neomikhe/ReliAgent/.github/workflows/release.yml

name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: build-${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            binary: reli
            platform: linux-x86_64
            ext: tar.gz
          - target: aarch64-apple-darwin
            runner: macos-15
            binary: reli
            platform: macos-aarch64
            ext: tar.gz
          - target: x86_64-pc-windows-msvc
            runner: windows-2025
            binary: reli.exe
            platform: windows-x86_64
            ext: zip
    env:
      TARGET: ${{ matrix.target }}
      BINARY: ${{ matrix.binary }}
      PLATFORM: ${{ matrix.platform }}
      EXT: ${{ matrix.ext }}

    steps:
      # The tag ends up in file names and shell commands: accept only plain
      # semver tags before using it anywhere.
      - name: check tag name
        shell: bash
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "refusing to release tag '${GITHUB_REF_NAME}'" >&2
              exit 1
          fi
          bundle="reli-${GITHUB_REF_NAME}-${PLATFORM}"
          echo "BUNDLE=${bundle}" >> "$GITHUB_ENV"
          echo "ARCHIVE=${bundle}.${EXT}" >> "$GITHUB_ENV"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # rustc records source paths (cargo registry, checkout) for panic
      # messages; remap them so the binary carries no runner paths.
      # package_release.sh fails if any build path is left in the bundle.
      - name: path remapping for every cargo step
        shell: bash
        run: echo "CARGO_ENCODED_RUSTFLAGS=$(bash scripts/release_rustflags.sh)" >> "$GITHUB_ENV"

      # The toolchain version comes from rust-toolchain.toml.
      - name: install rust
        shell: bash
        run: |
          channel="$(awk -F'"' '/^channel/ { print $2 }' rust-toolchain.toml)"
          rustup toolchain install "${channel}" --profile minimal \
              --component clippy,rustfmt --target "${TARGET}"
          rustup default "${channel}"

      # keyring's Secret Service backend links libdbus (libdbus-sys finds it
      # through pkg-config); the macOS and Windows backends need nothing.
      - name: system libraries (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libdbus-1-dev pkg-config

      # No cargo cache here, on purpose: a tag run can restore caches saved
      # on `main`, and test.yml runs third-party build scripts there. A
      # poisoned target/ would end up in a binary signed by this workflow.
      # Never add a cache (or a shared-key with test.yml) to this job.

      - name: fmt + clippy
        shell: bash
        run: |
          cargo fmt --all -- --check
          cargo clippy --all-targets --release --locked --target "${TARGET}" -- -D warnings

      - name: build
        shell: bash
        run: cargo build --release --locked --target "${TARGET}"

      - name: unit + integration + red-team tests
        shell: bash
        run: cargo test --release --locked --target "${TARGET}"

      # Binary + python-build-standalone runtime pinned in scripts/pbs.lock
      # (SHA-256 checked before extraction) + the stdlib-only sidecar, then
      # a smoke test of a copy of the bundle.
      - name: bundle and smoke-test
        shell: bash
        run: |
          bash scripts/package_release.sh "${TARGET}" \
              "target/${TARGET}/release/${BINARY}" "dist/${BUNDLE}"

      # The sidecar isolation tests (#[ignore], they need reliagent_python
      # installed) run against the interpreter that actually ships, on a
      # copy so the bundle stays untouched.
      - name: sidecar tests against the bundled interpreter
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/bundle-copy"
          cp -R "dist/${BUNDLE}" "${RUNNER_TEMP}/bundle-copy"
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
              py="$(cygpath -w "${RUNNER_TEMP}/bundle-copy/python/python.exe")"
          else
              py="${RUNNER_TEMP}/bundle-copy/python/bin/python3"
          fi
          RELI_TEST_PYTHON="${py}" cargo test --release --locked \
              --target "${TARGET}" --test bridge_jsonrpc -- --ignored

      # Owner/group 0 inside the archive: extracting as root must not hand
      # the files to whatever account has the runner's uid. On macOS, no
      # AppleDouble (._*) files or extended attributes: they would end up as
      # stray files in the bundle on Linux and in the SBOM.
      - name: archive
        shell: bash
        run: |
          mkdir -p out
          cd dist
          case "${RUNNER_OS}" in
              Windows) 7z a -tzip "../out/${ARCHIVE}" "${BUNDLE}" ;;
              macOS)   COPYFILE_DISABLE=1 tar --no-xattrs --no-mac-metadata \
                           --uid 0 --gid 0 --uname root --gname wheel \
                           -czf "../out/${ARCHIVE}" "${BUNDLE}" ;;
              *)       tar --owner=0 --group=0 --numeric-owner -czf "../out/${ARCHIVE}" "${BUNDLE}" ;;
          esac

      # The SBOM describes what ships: the bundle directory, not the workspace.
      - name: SBOM (SPDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/${{ env.BUNDLE }}
          format: spdx-json
          output-file: out/${{ env.ARCHIVE }}.spdx.json
          upload-artifact: false

      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: dist/${{ env.BUNDLE }}
          format: cyclonedx-json
          output-file: out/${{ env.ARCHIVE }}.cdx.json
          upload-artifact: false

      - name: hand over to the release job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: out/
          if-no-files-found: error
          retention-days: 3

  release:
    name: sign and publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write     # create/update the draft release
      id-token: write     # cosign keyless OIDC
      attestations: write # build provenance
    steps:
      - name: collect artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: install cosign
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: cosign sign (keyless OIDC)
        shell: bash
        run: |
          cd release
          shopt -s nullglob
          files=(reli-*.tar.gz reli-*.zip reli-*.spdx.json reli-*.cdx.json)
          if [[ ${#files[@]} -ne 9 ]]; then
              echo "expected 3 archives + 6 SBOMs, got ${#files[@]}: ${files[*]}" >&2
              exit 1
          fi
          for f in "${files[@]}"; do
              cosign sign-blob --yes \
                  --output-certificate "${f}.cert" \
                  --output-signature "${f}.sig" "${f}"
          done

      - name: build provenance attestation
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-path: |
            release/reli-*.tar.gz
            release/reli-*.zip

      - name: upload to the draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: release/*
          fail_on_unmatched_files: true
          draft: true
          body: |
            ## Verifying this release

            Every archive and SBOM is signed with [cosign](https://github.com/sigstore/cosign)
            using GitHub OIDC (no long-lived keys), and every archive has a GitHub
            build provenance attestation. Verify before extracting:

            ```bash
            cosign verify-blob \
                --certificate <archive>.cert \
                --signature   <archive>.sig \
                --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/release.yml@refs/tags/${{ github.ref_name }}" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com \
                <archive>

            gh attestation verify <archive> --repo ${{ github.repository }} \
                --signer-workflow ${{ github.repository }}/.github/workflows/release.yml
            ```

            `<archive>` is `reli-${{ github.ref_name }}-linux-x86_64.tar.gz`,
            `reli-${{ github.ref_name }}-macos-aarch64.tar.gz` or
            `reli-${{ github.ref_name }}-windows-x86_64.zip`. The `*.spdx.json` and
            `*.cdx.json` files are the SBOMs of each archive, each with its own
            signature pair.

            Extract as the user who will run `reli`, into a directory only that
            user can write: `reli` trusts the `python/` next to it.

            See [`docs/THREAT_MODEL.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/docs/THREAT_MODEL.md)
            and [`KNOWN_ISSUES.md`](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/KNOWN_ISSUES.md)
            before deploying.
