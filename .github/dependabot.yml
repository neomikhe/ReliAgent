# Dependabot: weekly update PRs for the Rust crates, the Python sidecar's
# lock file and the pinned GitHub Actions. Each PR runs .github/workflows/
# test.yml. `cooldown` follows the project's rule of only adopting
# releases that are at least two weeks old.
#
# Minor and patch updates arrive as one grouped PR per ecosystem; a major
# update gets its own PR, so each breaking change is reviewed on purpose
# (see docs/RELEASING.md).

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: uv
    directory: /python-core
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5
