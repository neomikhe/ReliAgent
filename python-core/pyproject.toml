[project]
name = "reliagent-python"
version = "0.0.5"
description = "ReliAgent Python sidecar (orchestrator + critic + LLM client)"
requires-python = ">=3.12"
dependencies = [
    "ollama>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliagent_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
