[project]
name = "reliagent-python"
version = "0.1.0"
description = "ReliAgent Python sidecar (orchestrator + critic + LLM client)"
requires-python = ">=3.12"
# Sin dependencias de ejecución: el cliente de Ollama usa solo la stdlib
# (ver ollama_http.py). Menos superficie de cadena de suministro y un
# empaquetado con python-build-standalone sin pip.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

# Backend de uv con un rango que cubre los uv usados (local y CI): uv usa
# entonces su backend integrado y `uv sync` no descarga nada sin fijar para
# construir el paquete (uv.lock no cubre las dependencias de construcción).
# El módulo es src/reliagent_python (disposición por defecto de uv_build).
[build-system]
requires = ["uv_build>=0.11.7,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
