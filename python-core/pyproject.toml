[project]
name = "reliagent-python"
version = "0.1.0"
description = "ReliAgent Python sidecar (orchestrator + critic + LLM client)"
requires-python = ">=3.12"
# Sin dependencias de ejecución: el cliente de Ollama usa solo la stdlib
# (ver ollama_http.py). Menos superficie de cadena de suministro y un
# empaquetado con python-build-standalone sin pip.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reliagent_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
