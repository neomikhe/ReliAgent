[package]
name = "reliagent"
version = "0.0.2"
edition = "2024"
description = "Kernel de políticas verificables para agentes de IA locales (Research Preview)"
license = "Apache-2.0"
publish = false

[[bin]]
name = "reli"
path = "src/main.rs"

[dependencies]
cap-std = "4.0.2"
clap = { version = "4.6.1", features = ["derive"] }
thiserror = "2.0.18"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", default-features = false, features = ["std", "formatting"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
getrandom = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
lto = true
codegen-units = 1
strip = true
